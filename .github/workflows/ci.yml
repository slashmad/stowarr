name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Install Python analysis tools
        run: python -m pip install '.[dev]'
      - name: Install JavaScript analysis tools
        run: npm ci
      - name: Install pinned repository analysis tools
        run: scripts/bootstrap-analysis-tools.sh
      - name: Ruff
        run: ruff check .
      - name: MyPy
        run: mypy
      - name: Bandit
        run: bandit -q -c pyproject.toml -r src/stowarr
      - name: Python dependency audit
        run: pip-audit --strict .
      - name: External mutation boundary
        run: python scripts/check-mutation-boundaries.py
      - name: ESLint
        run: npm run lint
      - name: JavaScript dependency audit
        run: npm run audit:dependencies
      - name: ShellCheck
        run: .tools/bin/shellcheck docker/entrypoint.sh scripts/*.sh
      - name: Actionlint
        run: .tools/bin/actionlint -shellcheck=.tools/bin/shellcheck
      - name: Hadolint
        run: .tools/bin/hadolint Dockerfile

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile src/stowarr/*.py

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build Stowarr image
        run: docker compose build --pull
      - name: Verify the installed API and WebUI package
        run: >-
          docker run --rm --entrypoint python "$(docker compose config --images)"
          -c 'from importlib.resources import files; import stowarr.server; assert files("stowarr").joinpath("web", "index.html").is_file()'
