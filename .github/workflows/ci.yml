name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Python analysis tools
        run: python -m pip install '.[dev]'
      - name: Install JavaScript analysis tools
        run: npm ci
      - name: Ruff
        run: ruff check .
      - name: MyPy
        run: mypy
      - name: Bandit
        run: bandit -q -c pyproject.toml -r src/stowarr
      - name: ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile src/stowarr/*.py
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
