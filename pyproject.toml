[project]
name = "stowarr"
version = "1.0.0b3"
description = "Transactional pool reconciliation for qBittorrent and *Arr"
requires-python = ">=3.12"
authors = [
    { name = "slashmad" },
]
readme = "README.md"
license = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/slashmad/stowarr"
Repository = "https://github.com/slashmad/stowarr"
Issues = "https://github.com/slashmad/stowarr/issues"

[project.scripts]
stowarr = "stowarr.cli:main"

[project.optional-dependencies]
dev = [
    "bandit[toml]~=1.9.4",
    "mypy~=2.3.0",
    "ruff~=0.16.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stowarr = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/stowarr"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "stowarr.engine"
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests"]
